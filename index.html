<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JusticeApp — book in Nicosia</title>
  <meta name="description" content="Book one-to-one sessions or private studio time at JUSTICE Fitness & Dance, Nicosia (Ilia Venezi 5).">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a9d8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JusticeApp">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body class="page--home">
  <div id="site-top" class="top-anchor" aria-hidden="true"></div>
  <div id="j-header"></div>

  <main class="home-main">
    <section class="home" aria-labelledby="home-schedule-heading">
      <div class="home__date" role="group" data-i18n-attr="aria-label:home_date_aria">
        <div class="home__date-waves" aria-hidden="true">
          <svg class="home__date-waves-svg" viewBox="0 0 200 120" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <path fill="rgb(129 200 190 / 0.2)" d="M72 120c28-38 12-78 44-120H200v120H72z" />
            <path fill="rgb(77 182 172 / 0.16)" d="M96 120c22-32 4-68 40-120h64v120H96z" />
            <path fill="rgb(255 255 255 / 0.42)" d="M0 120c36-22 52-58 88-86s48-18 112-34v120H0z" />
          </svg>
        </div>
        <div class="home__date-dots" aria-hidden="true"></div>
        <div class="home__date-inner">
          <div class="home__date-top">
            <div class="home__date-copy">
              <span class="home__date-weekday" id="j-home-date-weekday"></span>
              <span class="home__date-numeric" id="j-home-date-numeric"></span>
              <span class="home__date-month" id="j-home-date-month"></span>
            </div>
            <div class="home__date-icon" aria-hidden="true">
              <svg class="home__date-icon-svg" width="21" height="21" viewBox="0 0 24 24" fill="none">
                <rect x="3.5" y="5.5" width="17" height="14" rx="2" stroke="currentColor" stroke-width="1.35" />
                <path d="M3.5 10.5h17" stroke="currentColor" stroke-width="1.35" />
                <path d="M8 3.5V7M16 3.5V7" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <div class="home__today">
        <header class="home__intro">
          <h2 id="home-schedule-heading" class="home__heading" data-i18n="home_today_schedule">Today at the studio</h2>
        </header>

        <article id="j-home-preview" class="home-card home-card--schedule" aria-busy="true" aria-live="polite">
          <p class="home-card__placeholder">&nbsp;</p>
        </article>
      </div>

      <div class="home__booking">
        <a class="home__book-private" href="book.html#book-individual">
          <div class="home__book-private-text">
            <span class="home__book-private-title" data-i18n="home_book_private_title">Book Private</span>
            <span class="home__book-private-sub" data-i18n="home_book_private_desc">One-to-One Class</span>
          </div>
          <span class="home__book-private-arrow" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
        <div class="home__book-row">
          <a class="home__book-tile home__book-tile--studio" href="book.html#book-studio">
            <div class="home__book-tile-text">
              <span class="home__book-tile-title" data-i18n="home_book_studio_title">Book Studio</span>
              <span class="home__book-tile-desc" data-i18n="home_book_studio_desc">Private studio rental</span>
            </div>
            <span class="home__book-tile-go" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </a>
          <a class="home__book-tile home__book-tile--group" href="schedule.html">
            <div class="home__book-tile-text">
              <span class="home__book-tile-title" data-i18n="home_group_sched_title">Group Schedule</span>
              <span class="home__book-tile-desc" data-i18n="home_group_sched_desc">See all upcoming classes</span>
            </div>
            <span class="home__book-tile-go" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
