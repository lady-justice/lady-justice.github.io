<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <link rel="canonical" href="./#/book">
  <script>
    location.replace(location.pathname.replace(/[^/]*$/, '') + '#/book');
  </script>
  <meta http-equiv="refresh" content="0;url=./#/book">
</head>
<body>
  <p><a href="./#/book">Continue to booking</a></p>
</body>
</html>
