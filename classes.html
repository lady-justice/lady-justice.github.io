<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirect — JusticeApp</title>
    <link rel="canonical" href="./#/schedule" />
    <script>
      location.replace(location.pathname.replace(/[^/]*$/, '') + '#/schedule');
    </script>
    <meta http-equiv="refresh" content="0;url=./#/schedule" />
  </head>
  <body>
    <p><a href="./#/schedule">Continue to schedule</a></p>
  </body>
</html>
