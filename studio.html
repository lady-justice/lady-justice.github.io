<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <link rel="canonical" href="./#/studio" />
    <script>
      location.replace(location.pathname.replace(/[^/]*$/, '') + '#/studio');
    </script>
    <meta http-equiv="refresh" content="0;url=./#/studio" />
  </head>
  <body>
    <p><a href="./#/studio">Continue to studio</a></p>
  </body>
</html>
