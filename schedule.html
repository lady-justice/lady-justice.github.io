<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Group schedule — JusticeApp</title>
  <meta name="description" content="Mon–Sat group class schedule at JUSTICE Fitness & Dance, Nicosia. Personal bookings use Calendly.">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a9d8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JusticeApp">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body class="page--schedule">
  <div id="site-top" class="top-anchor" aria-hidden="true"></div>
  <div id="j-header"></div>

  <main>
    <section class="schedule" id="schedule" data-i18n-attr="aria-label:nav_schedule">
      <p class="schedule__kicker" data-i18n="schedule_group_kicker">Group classes</p>
      <div class="week week--calendar" role="region" data-i18n-attr="aria-label:schedule_week_aria">
        <div class="week__hero">
          <div class="week__hero-slide-viewport">
            <div class="week__hero-slide week__slider-pane" id="j-week-hero-slide">
              <div class="week__hero-date" id="j-schedule-hero" aria-live="polite">
                <span class="week__hero-daynum" id="j-schedule-hero-dd"></span>
                <div class="week__hero-stack">
                  <span class="week__hero-weekday" id="j-schedule-hero-weekday"></span>
                  <span class="week__hero-monthyear" id="j-schedule-hero-my"></span>
                </div>
              </div>
            </div>
          </div>
          <button type="button" class="week__today" id="j-schedule-today" data-i18n="schedule_today">Today</button>
        </div>
        <div class="week__strip-row">
          <button type="button" class="week__nav week__nav--prev" id="j-week-prev" data-i18n-attr="aria-label:schedule_week_prev_aria">
            <svg class="week__nav-icon" width="6" height="11" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="M9 3L3 10l6 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="week__slider-viewport">
            <div class="week__slider-pane" id="j-week-slider-pane">
              <div class="week__strip" id="j-week-strip" role="tablist" data-i18n-attr="aria-label:schedule_tabs_aria"></div>
              <div class="week__list-head">
                <span class="week__list-head-time" data-i18n="schedule_col_time">Time</span>
                <span class="week__list-head-course" data-i18n="schedule_col_course">Course</span>
                <span class="week__list-head-sort" aria-hidden="true"></span>
              </div>
              <div class="week__panels" id="j-week-panels"></div>
            </div>
          </div>
          <button type="button" class="week__nav week__nav--next" id="j-week-next" data-i18n-attr="aria-label:schedule_week_next_aria">
            <svg class="week__nav-icon" width="6" height="11" viewBox="0 0 12 20" fill="none" aria-hidden="true"><path d="M3 3l6 7-6 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
