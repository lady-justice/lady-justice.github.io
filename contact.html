<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Contact — JusticeApp</title>
  <meta name="description" content="Email, phone, and Instagram for JUSTICE Fitness & Dance, Nicosia.">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a9d8c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JusticeApp">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="assets/styles/main.css">
</head>
<body class="page--contact">
  <div id="site-top" class="top-anchor" aria-hidden="true"></div>
  <div id="j-header"></div>

  <main class="contact-page">
    <header class="contact-intro">
      <h1 class="contact-intro__title" data-i18n="contact_intro_title">Contact</h1>
      <p class="contact-intro__note" data-i18n="contact_intro_note">Bookings and questions — reach us by email, phone, or Instagram.</p>
      <p class="contact-page__cross">
        <a class="contact-page__cross-link" href="studio.html" data-i18n="contact_link_studio">Studio location &amp; map</a>
      </p>
    </header>

    <div id="site-footer-touch" class="footer__touch contact-page__touch">
      <p class="footer__eyebrow" data-i18n="footer_touch_eyebrow">Bookings, studio visits, or a quick hello</p>
      <h2 class="footer__title">
        <span data-i18n="footer_touch_line" data-i18n-attr="aria-label:footer_touch_aria">Get in touch</span>
      </h2>
    </div>

    <div class="footer__panel contact-page__panel">
      <div class="footer__cols">
        <section class="footer__col">
          <h3 class="footer__col-title" data-i18n="footer_social">Socials</h3>
          <ul class="footer__list footer__list--ig">
            <li>
              <a class="footer__social" href="https://www.instagram.com/__lady.justice_/" target="_blank" rel="noopener noreferrer" data-i18n-attr="title:footer_ig_lj_title">
                <svg class="footer__social-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="3.75" stroke="currentColor" stroke-width="1.4"/><circle cx="17.25" cy="6.75" r="0.9" fill="currentColor"/></svg>
                <span data-i18n="footer_social_lj_label">Instagram</span>
              </a>
              <span class="footer__note" data-i18n="footer_artist">artist</span>
            </li>
            <li>
              <a class="footer__social" href="https://www.instagram.com/justicefitnessanddance/" target="_blank" rel="noopener noreferrer" data-i18n-attr="title:footer_ig_j_title">
                <svg class="footer__social-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="12" r="3.75" stroke="currentColor" stroke-width="1.4"/><circle cx="17.25" cy="6.75" r="0.9" fill="currentColor"/></svg>
                <span>Justice Fitness &amp; Dance</span>
              </a>
              <span class="footer__note" data-i18n="footer_studio">studio</span>
            </li>
          </ul>
        </section>
        <section class="footer__col">
          <h3 class="footer__col-title" data-i18n="footer_contacts">Contacts</h3>
          <ul class="footer__list">
            <li><a href="mailto:hello@example.com">hello@example.com</a></li>
            <li><a href="tel:+10000000000">+1 (000) 000-0000</a></li>
          </ul>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
